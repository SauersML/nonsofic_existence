name = "NonsoficGroupsExist"
version = "0.1.0"
defaultTargets = ["NonsoficGroupsExist", "Superseded"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[lean_lib]]
name = "NonsoficGroupsExist"
moreLeanArgs = ["-DwarningAsError=true"]

# The audit's own library: detector logic only, no side effects, so it can be
# built and calibrated independently of the corpus it audits.  The drivers
# (scripts/Audit.lean, scripts/Calibrate.lean) are deliberately NOT roots here
# -- they run under `lake env lean` and their whole purpose is to fail.
#
# No `warningAsError`: this library is instrumentation, and a deprecation
# warning in a detector must not be able to take the corpus build down with it.
[[lean_lib]]
name = "Audit"
srcDir = "scripts"
roots = ["Audit.DeclFilter", "Audit.Scan", "Audit.Plants"]

# Superseded developments.  A separate library, not a subdirectory, and named
# `Superseded` rather than `Archive` because Mathlib ships a library called
# `Archive` and the target name resolves to that one.  The library root does
# not import it, so
# `scripts/Audit.lean` -- which walks the environment of that root -- never
# sees these declarations.  It is a default target so CI still builds it and
# it cannot rot; it is off the trust surface, not out of maintenance.
[[lean_lib]]
name = "Superseded"
moreLeanArgs = ["-DwarningAsError=true"]
