name: Build and commit PDF

on:
  push:
    branches:
      - main
    paths:
      - nonsofic_groups_exist.tex
      - .github/workflows/build-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-nonsofic-pdf-main
  cancel-in-progress: true

env:
  TEX_FILE: nonsofic_groups_exist.tex
  PDF_FILE: nonsofic_groups_exist.pdf

jobs:
  build-pdf:
    name: Build PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install TeX Live
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-science

      - name: Build PDF
        shell: bash
        run: |
          set -euo pipefail

          test -f "$TEX_FILE"

          # Keep PDF metadata reproducible for an unchanged TeX source.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- "$TEX_FILE")"
          export FORCE_SOURCE_DATE=1
          export TZ=UTC

          latexmk -C "$TEX_FILE"
          latexmk \
            -pdf \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            "$TEX_FILE"

          test -s "$PDF_FILE"

          # Fail rather than committing a PDF with unresolved citations or references.
          if grep -Eq \
            'LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined)' \
            "${TEX_FILE%.tex}.log"; then
            echo "The final LaTeX run contains unresolved citations or references." >&2
            exit 1
          fi

      - name: Commit and push updated PDF
        shell: bash
        run: |
          set -euo pipefail

          build_base="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$PDF_FILE"

          if git diff --cached --quiet; then
            echo "PDF is already up to date."
            exit 0
          fi

          git commit -m "build: update compiled PDF [skip ci]"

          # Do not push a PDF built from stale TeX if main advanced during the job.
          git fetch origin main
          remote_main="$(git rev-parse origin/main)"

          if [[ "$remote_main" != "$build_base" ]]; then
            if ! git diff --quiet "$build_base" "$remote_main" -- \
              "$TEX_FILE" \
              .github/workflows/build-pdf.yml; then
              echo "Main changed while this PDF was building; skipping the stale push."
              exit 0
            fi

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "A newer conflicting PDF already exists; skipping this push."
              exit 0
            fi
          fi

          git push origin HEAD:main

