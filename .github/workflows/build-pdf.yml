
# The validated PDF is intentionally versioned on main for direct access.
name: Build and commit PDF

on:
  push:
    branches:
      - main
    paths:
      - nonsofic_groups_exist.tex
      # The generated claim map is checked for staleness by this workflow's
      # source audit, so a direct (hand) edit to it must trigger the check
      # that rejects hand edits.
      - docs/CLAIM_MAP.md
      - .github/workflows/build-pdf.yml
      # The margin-reference gate is a gate, so a change to it must re-run it.
      # Naming the two entry points was not enough once they grew a shared
      # library: an edit to `claim_map.py` could change what counts as a valid
      # reference, or stop the check firing at all, without this workflow ever
      # running.  `prover.yml` watches all of `scripts/` for the same reason.
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-nonsofic-pdf-main
  cancel-in-progress: true

env:
  TEX_FILE: nonsofic_groups_exist.tex
  PDF_FILE: nonsofic_groups_exist.pdf

jobs:
  build-pdf:
    name: Build and validate PDF
    runs-on: ubuntu-latest
    # A typical run is 1-3 minutes, nearly all of it `apt-get`.  Run
    # 30979154338 spent all 25 minutes inside that install -- `lmodern` alone
    # took 4.5 minutes off a slow Azure mirror -- and was killed before latexmk
    # ever started, leaving the committed PDF stale against the `.tex` that
    # triggered it.  The ceiling exists to catch a wedged latexmk, not to race
    # a mirror, so it sits well above any real compile.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install TeX and PDF validation tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Retries and a per-connection timeout so one unresponsive mirror
          # costs seconds rather than the whole job; see the note on
          # `timeout-minutes` above for the run that made this necessary.
          retry='-o Acquire::Retries=5 -o Acquire::http::Timeout=30'
          sudo apt-get $retry update
          sudo apt-get $retry install --yes --no-install-recommends \
            latexmk \
            lmodern \
            poppler-utils \
            qpdf \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-science

      # The manuscript's margin notes name Lean modules and declarations.  A
      # rename on either side would leave the paper pointing at something that
      # no longer exists, and LaTeX cannot notice that -- so check it here,
      # before the PDF that would carry the broken reference is built.
      - name: Check the Lean margin references resolve
        shell: bash
        run: python3 scripts/check_lean_refs.py

      # The full source audit, not just reference resolution: a TeX-only edit
      # can change a margin note's status or let docs/CLAIM_MAP.md go stale,
      # and `prover.yml` does not trigger on the manuscript.  Running the
      # whole scan here closes that window; it needs no Lean toolchain.
      - name: Source audit and claim-map staleness
        shell: bash
        run: |
          python3 scripts/check.py --self-test
          python3 scripts/check.py

      - name: Compile, normalize, and validate PDF
        shell: bash
        run: |
          set -euo pipefail

          test -f "$TEX_FILE"

          base_name="${TEX_FILE%.tex}"
          raw_pdf="build/${base_name}.pdf"
          log_file="build/${base_name}.log"
          temporary_pdf="${PDF_FILE}.tmp"

          rm -rf build pdf-render-check
          rm -f "$temporary_pdf"
          mkdir -p build pdf-render-check

          # Keep the direct LaTeX output stable when the TeX source is unchanged.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- "$TEX_FILE")"
          export FORCE_SOURCE_DATE=1
          export TZ=UTC

          latexmk \
            -pdf \
            -outdir=build \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            "$TEX_FILE"

          test -s "$raw_pdf"
          test -s "$log_file"

          # Do not publish a document whose final LaTeX pass still needs reruns
          # or contains unresolved references or citations.
          if grep -Eq \
            'LaTeX Warning: (Citation .* undefined|Reference .* undefined|There were undefined references|Label\(s\) may have changed)|Rerun to get cross-references right' \
            "$log_file"; then
            echo "The final LaTeX pass still has unresolved references or citations." >&2
            exit 1
          fi

          # Nothing may protrude or collide: no overfull boxes anywhere (the
          # margin notes included -- a note wider than the margin is an
          # overfull hbox), and no marginpar the placement machinery lost or
          # had to move.  marginfix stacks the notes, so a clean document
          # compiles with zero hits here.
          if grep -Eq \
            'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' \
            "$log_file"; then
            echo "Overflowing or colliding material in the final LaTeX pass:" >&2
            grep -E 'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' "$log_file" >&2
            exit 1
          fi

          # Rewrite the pdfTeX output into a conservative format that GitHub,
          # browser PDF.js viewers, and older PDF readers handle reliably:
          # linearized PDF 1.4 with no PDF 1.5 object streams.
          qpdf \
            --linearize \
            --object-streams=disable \
            --force-version=1.4 \
            --deterministic-id \
            "$raw_pdf" "$temporary_pdf"

          mv -- "$temporary_pdf" "$PDF_FILE"
          test -s "$PDF_FILE"

          # Structural validation.
          qpdf --check "$PDF_FILE"
          pdfinfo "$PDF_FILE"

          pdf_header="$(head -c 8 "$PDF_FILE")"
          if [[ "$pdf_header" != '%PDF-1.4' ]]; then
            echo "Unexpected PDF header: $pdf_header" >&2
            exit 1
          fi

          # Rendering validation: this catches files that are structurally
          # readable but fail in an actual PDF renderer.  Every page, not just
          # the first -- margin notes and figures live throughout the
          # document, and a renderer failure on page 40 is as disqualifying
          # as one on page 1.  Low resolution keeps the full sweep cheap.
          pdftoppm \
            -png \
            -r 72 \
            "$PDF_FILE" \
            pdf-render-check/page

          page_count="$(pdfinfo "$PDF_FILE" | awk '/^Pages:/ {print $2}')"
          rendered_count="$(ls pdf-render-check/page-*.png | wc -l)"
          if [[ "$rendered_count" -ne "$page_count" ]]; then
            echo "Rendered $rendered_count of $page_count pages" >&2
            exit 1
          fi
          for f in pdf-render-check/page-*.png; do
            test -s "$f"
          done

      - name: Commit and push updated PDF
        shell: bash
        env:
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The PDF is a function of the TeX source alone, so only a *newer TeX
          # source* on main can invalidate it.  Bailing whenever main merely
          # advanced was wrong: this workflow is filtered on the `.tex` path, so
          # a Lean-only commit landing mid-build triggers no run of its own, and
          # the PDF it deferred to never got built.  Run 31092473277 lost
          # c732171's PDF exactly that way -- green job, stale PDF on main.
          built_tex="$(git rev-parse "$START_SHA:$TEX_FILE")"

          # Hold the built PDF outside the work tree; the replay below resets
          # the checkout to whatever main currently is.
          pdf_holding="${RUNNER_TEMP}/${PDF_FILE}"
          cp -- "$PDF_FILE" "$pdf_holding"

          git fetch origin main

          for attempt in 1 2 3; do
            remote_main="$(git rev-parse origin/main)"

            if [[ "$(git rev-parse "$remote_main:$TEX_FILE")" != "$built_tex" ]]; then
              echo "main carries a newer $TEX_FILE; that push builds the PDF matching it."
              exit 0
            fi

            # Replay the PDF onto current main, keeping whatever else landed.
            git reset --hard "$remote_main"
            cp -- "$pdf_holding" "$PDF_FILE"
            git add -- "$PDF_FILE"

            if git diff --cached --quiet -- "$PDF_FILE"; then
              echo "The committed PDF is already current."
              exit 0
            fi

            git commit -m "build: update compiled PDF [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; main moved underneath it. Retrying."
            git fetch origin main
          done

          echo "Could not push the updated PDF after 3 attempts." >&2
          exit 1
