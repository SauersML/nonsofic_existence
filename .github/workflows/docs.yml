# API documentation.  Deliberately NOT part of the proof gate: this workflow
# never blocks a merge, and `doc-gen4` breaking must not be able to make the
# repository look unproved.  The gate is `prover.yml`;
# `independent-kernel.yml` is supplementary and, by its own design, not a
# gate either.
name: API documentation

on:
  schedule:
    # Weekly, after the independent-kernel run: doc-gen4 is expensive and
    # deliberately non-gating, and rebuilding the API reference on every push
    # spent more runner time than the prover gate itself -- usually to be
    # cancelled by the next push.  Sundays, 06:00 UTC.
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build and publish doc-gen4 output
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get || true

      - name: Build the documentation
        working-directory: docbuild
        run: |
          lake update -R
          lake build NonsoficGroupsExist:docs

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
